name: Nomos showcase

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "rules/**"
      - "groups/**"
      - "profiles/**"
      - "situational-prompts/**"
      - "ontology/**"
      - "relationships/**"
      - "queues/specimens/**"
      - "processing/specimens/**"
      - "queues/profiles/**"
      - "queues/situational-prompts/**"
      - "queues/situational-ontology/**"
      - "queues/situational-ontology/**"
      - "schema/**"
      - "taxonomy/**"
      - "processing/specimens/candidates/**"
      - "processing/situational-ontology/**"
      - "processing/situational-prompts/revisions/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nomos-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public catalog snapshot
        run: python3 tools/build_site_catalog.py
      - name: Run checks
        run: |
          python3 tools/validate.py
          python3 tools/validate_situational_prompts.py
          python3 tools/validate_situational_prompt_ideas.py
          python3 tools/validate_situational_prompt_revisions.py
          python3 tools/validate_situational_ontology_queue.py
          python3 tools/validate_formal_situational_ontology.py
          python3 tools/validate_situational_processing.py
          python3 tools/validate_groups.py
          python3 tools/relationships.py
          python3 -m unittest discover -s tests -v
          node --check docs/app.js
          node --check docs/situational-prompts.js
          node --check docs/situational-ontology.js
          node --test tests/test_situational_ontology_browser.cjs
          node --test tests/test_situational_prompts.cjs
          node --check docs/rule-colors.js
          node --check docs/reasoning.js
          node --check docs/groups.js
          node --check docs/catalog-browser.js
          node --test tests/test_groups_browser.cjs tests/test_catalog_browser.cjs tests/test_app_sort_wiring.cjs
          node --test tests/test_rule_colors.cjs tests/test_reasoning.cjs
          node --check tools/profiles.js
          node --check tools/validate_profiles.cjs
          node tools/validate_profiles.cjs
          node --check tools/profile_ideas.cjs
          node --check tools/validate_profile_ideas.cjs
          node tools/validate_profile_ideas.cjs
          node --test tests/test_profile_ideas.cjs
          node --test tests/test_profiles.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
