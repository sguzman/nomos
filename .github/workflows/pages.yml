name: Nomos showcase

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "rules/**"
      - "processing/specimens/candidates/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nomos-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public catalog snapshot
        run: python3 tools/build_site_catalog.py
      - name: Run checks
        run: |
          python3 tools/validate.py
          python3 -m unittest discover -s tests -v
          node --check docs/app.js
          node --check docs/rule-colors.js
          node --check docs/reasoning.js
          node --test tests/test_rule_colors.cjs tests/test_reasoning.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
