name: Nomos showcase

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "docs/**"
      - "rules/**"
      - "groups/**"
      - "profiles/**"
      - "end-consumer-profiles/**"
      - "situational-prompts/**"
      - "ontology/**"
      - "queues/rule-situation-intent/**"
      - "processing/rule-situation-intent/**"
      - "relationships/**"
      - "queues/specimens/**"
      - "processing/specimens/**"
      - "queues/profiles/**"
      - "queues/situational-prompts/**"
      - "queues/situational-ontology/**"
      - "queues/rule-situation-intent/**"
      - "schema/**"
      - "taxonomy/**"
      - "processing/specimens/candidates/**"
      - "processing/situational-ontology/**"
      - "processing/situational-prompts/revisions/**"
      - "audits/strict-port-coverage-2026-10-25.*"
      - "audits/strict-port-remediation*"
      - "audits/cpp-port-*"
      - "audits/c-port-*"
      - "audits/new-rust-project-*"
      - "audits/remaining-profile-*"
      - "audits/profile-vnext-*"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nomos-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public catalog snapshot
        run: python3 tools/build_site_catalog.py
      - name: Run checks
        run: |
          python3 tools/validate.py
          python3 tools/validate_situational_prompts.py
          python3 tools/validate_situational_prompt_ideas.py
          python3 tools/validate_situational_prompt_revisions.py
          python3 tools/validate_situational_ontology_queue.py
          python3 tools/validate_formal_situational_ontology.py
          python3 tools/validate_rule_situation_intent_links.py
          python3 tools/validate_situational_processing.py
          python3 tools/validate_groups.py
          python3 tools/relationships.py
          python3 -m unittest discover -s tests -v
          node --check docs/app.js
          node --check docs/situational-prompts.js
          node --check docs/situational-ontology.js
          node --check docs/rule-concepts.js
          node --check docs/profile-companions.js
          node --test tests/test_profile_companions_browser.cjs
          node --test tests/test_rule_concepts_browser.cjs
          node tools/validate_rule_situation_intent_queue.cjs
          node --test tests/test_rule_situation_intent_queue.cjs
          node --test tests/test_situational_ontology_browser.cjs
          node --test tests/test_situational_prompts.cjs
          node --check docs/rule-colors.js
          node --check docs/reasoning.js
          node --check docs/groups.js
          node --check docs/catalog-browser.js
          node --test tests/test_groups_browser.cjs tests/test_catalog_browser.cjs tests/test_app_sort_wiring.cjs
          node --test tests/test_rule_colors.cjs tests/test_reasoning.cjs
          node --check tools/profiles.js
          node --check tools/validate_profiles.cjs
          node tools/validate_profiles.cjs
          node tools/profile_companions.cjs --check
          node --test tests/test_profile_companions.cjs
          node tools/validate_strict_port_coverage.cjs
          node --test tests/test_strict_port_coverage.cjs
          node tools/validate_port_remediation.cjs
          node --test tests/test_port_remediation.cjs
          node tools/validate_cpp_port_remediation.cjs
          node --test tests/test_cpp_port_remediation.cjs
          node tools/validate_c_port_remediation.cjs
          node --test tests/test_c_port_remediation.cjs
          node tools/validate_new_rust_project_remediation.cjs
          node --test tests/test_new_rust_project_remediation.cjs
          node tools/validate_remaining_profile_remediation.cjs
          node --test tests/test_remaining_profile_remediation.cjs
          node tools/validate_profile_vnext_semantics.cjs
          node --test tests/test_profile_vnext_semantics.cjs
          node --check tools/profile_ideas.cjs
          node --check tools/validate_profile_ideas.cjs
          node tools/validate_profile_ideas.cjs
          node --test tests/test_profile_ideas.cjs
          node --test tests/test_profiles.cjs
          node --check tools/validate_agent_consumption_roadmap.cjs
          node tools/validate_agent_consumption_roadmap.cjs
          node --test tests/test_agent_consumption_roadmap.cjs
          node --test tests/test_end_consumer_profiles.cjs
          node --test tests/test_end_consumer_v1.cjs
          node --check docs/end-consumer-profiles.js
          node --check tools/projections.cjs
          node --test tests/test_projections.cjs
          node --check tools/agent_package.cjs
          node --check tools/agent_package_verify.cjs
          node --check tools/export_agent_package.cjs
          node --test tests/test_agent_package.cjs
          node --check tools/agent_phase_reader.cjs
          node --test tests/test_agent_phase_reader.cjs
          node --check tools/validate_agent_run_evidence.cjs
          node --test tests/test_agent_run_evidence.cjs
          node --check tools/run_luna_acceptance.cjs
          node --test tests/test_luna_acceptance_plan.cjs
          node --check tools/run_luna_acceptance_suite.cjs
          node --test tests/test_luna_acceptance_suite.cjs
          node --check tools/codex_trace_observer.cjs
          node --test tests/test_codex_trace_observer.cjs
          node --test tests/test_agent_workflow.cjs
          node --test tests/test_agent_consumption_cases.cjs
          node --test tests/test_agent_adversarial.cjs
          node --check tools/agent_package_diff.cjs
          node --test tests/test_agent_package_diff.cjs
          node --check docs/builder-logic.js
          node --check docs/rule-builder.js
          node --test tests/test_rule_builder.cjs
          node --test tests/test_rule_builder_browser.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-check deployed guided builder
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          SITE_BASE="${SITE_URL%/}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          for file in rule-builder.html builder-logic.js rule-builder.js catalog.json; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
              "$SITE_BASE/$file?revision=$GITHUB_SHA" --output "$TMP/$file"
            test -s "$TMP/$file"
          done
          grep -q 'Guided rule builder' "$TMP/rule-builder.html"
          grep -q 'NomosBuilder' "$TMP/builder-logic.js"
          grep -q 'builder-progress' "$TMP/rule-builder.js"
          python3 - "$TMP/catalog.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data['schema_version']=='3.0'
          assert len(data['profiles'])>=12
          assert len(data['rules'])>=243
          PY
          echo "Deployed Pages guided builder and catalog passed HTTP smoke check."
      - name: Run deployed Chromium guided-builder walk-through
        env:
          NOMOS_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$NOMOS_SITE_URL"
          node --test tests/test_rule_builder_browser.cjs
